name: 執行部落格連結自動同步

on:
  workflow_dispatch: # 手動觸發

permissions:
  contents: write # 賦予修改並寫回 HTML 的權限

env:
  # 💡 官方建議：強制指定 Actions 引擎使用 Node.js 24 執行，徹底消除警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 複製這份專案的程式碼
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. 安裝 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 執行你寫好的 build_blog.py
    - name: Run Python Script
      run: python build_blog.py

    # 4. 自動 Commit 並 Push 回你的 GitHub
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        if ! git diff --staged --quiet; then
          git commit -m "🤖 自動化機器人：同步更新延伸閱讀選單連結 (Node24 環境)"
          git push
        else
          echo "沒有任何檔案變更，跳過 Commit。"
        fi
